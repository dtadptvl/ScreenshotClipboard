name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: screenshotclipboard-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.6.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build device app without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project ScreenshotClipboard.xcodeproj \
            -scheme ScreenshotClipboard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild.log
      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name 'ScreenshotClipboard.app' -type d | head -1)
          test -n "$APP"
          rm -rf Payload ScreenshotClipboard-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload ScreenshotClipboard-unsigned.ipa
      - name: Upload IPA and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ScreenshotClipboard-build
          path: |
            ScreenshotClipboard-unsigned.ipa
            xcodebuild.log
          if-no-files-found: warn
